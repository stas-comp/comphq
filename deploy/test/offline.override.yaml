# Compose override for the offline test (P1-12): the app container joins
# an internal-only network (no route to the internet), and a `runner`
# service — the digest-pinned Playwright image, with the checked-out repo
# mounted — runs the smoke suite against it over that network only.
# Applied with `docker compose -f truenas.yaml -f offline.override.yaml`.
# Not read-only: Playwright needs to write test-results/, and this
# container is thrown away after every run either way.
services:
  comphq:
    networks:
      - internal_only
    environment:
      COMPHQ_TEST_MODE: "1"

  runner:
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    networks:
      - internal_only
    working_dir: /work
    volumes:
      - ${REPO_ROOT}:/work
    environment:
      BASE_URL: "http://comphq:8080"
    entrypoint: ["npx"]
    # --output keeps this container's own artifacts out of the (mounted,
    # host-shared) test-results/: it runs as root, and root-owned files
    # there would then block the host's own, non-root Playwright runs
    # (e.g. the upgrade/rollback sub-test, right after this one).
    command: ["playwright", "test", "--project=smoke", "--output=/tmp/test-results"]

networks:
  internal_only:
    internal: true
