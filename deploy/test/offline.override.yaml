# Compose override for the offline test (P1-12): the app container joins
# an internal-only network (no route to the internet), and a `runner`
# service — the digest-pinned Playwright image, with the checked-out repo
# mounted read-only — runs the smoke suite against it over that network
# only. Applied with `docker compose -f truenas.yaml -f offline.override.yaml`.
services:
  comphq:
    networks:
      - internal_only
    environment:
      COMPHQ_TEST_MODE: "1"

  runner:
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    networks:
      - internal_only
    working_dir: /work
    volumes:
      - ${REPO_ROOT}:/work:ro
    environment:
      BASE_URL: "http://comphq:8080"
    entrypoint: ["npx"]
    command: ["playwright", "test", "--project=smoke"]

networks:
  internal_only:
    internal: true
