<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<title>MC HQ</title>
<!--
  The MC HQ mark (D-103), drawn the same way as Comp HQ's in comphq.design.svg:
  run `npm run icons` and tools/icons/render.mjs embeds the vendored Big
  Shoulders Display font into web/static/theme/icons/mc/mchq.svg and renders
  every PNG and the .ico from it.

  The stacked wordmark of MC HQ's sidebar: a small, wide-spaced MC over a large
  gold HQ, on crimson. The colours are MC HQ's theme tokens (theme.css,
  :root[data-brand="mc"]): --color-ink-navy (crimson), --color-white and
  --color-signal-orange (gold).

  The same three groups as Comp HQ's mark: #stacked (MC over HQ, from 48 pixels
  up), #hq-only (HQ alone, for 16 and 32), and the #field, a rounded square the
  renderer squares off for the maskable icon. Every letter sits inside the
  central circle of radius 205 (the maskable safe zone).
-->
<rect id="field" width="512" height="512" rx="104" fill="#6b0f24"/>
<g id="stacked" font-family="Big Shoulders Display" text-anchor="middle">
<text x="266" y="165" font-weight="800" font-size="67" letter-spacing="20" fill="#ffffff">MC</text>
<text x="257" y="389" font-weight="900" font-size="256" letter-spacing="-3" fill="#f2b632">HQ</text>
</g>
<g id="hq-only" font-family="Big Shoulders Display" text-anchor="middle" display="none">
<text x="258" y="428" font-weight="900" font-size="430" letter-spacing="-4" fill="#f2b632">HQ</text>
</g>
</svg>
