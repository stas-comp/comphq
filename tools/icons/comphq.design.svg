<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<title>Comp HQ</title>
<!--
  The Comp HQ mark, drawn once. This is the only place it is designed: run
  `npm run icons` and tools/icons/render.mjs embeds the vendored Big Shoulders
  Display font into web/static/theme/icons/comphq.svg (so the file draws the same
  everywhere, with no font installed) and renders every PNG and the .ico from it.

  It is the stacked wordmark of the sidebar (SPEC gate 4.13): a small,
  wide-spaced COMP over a large accent HQ, on the ink navy. The colours are the
  theme tokens --color-ink-navy, --color-white and --color-signal-orange.

  Three groups, of which the renderer shows the ones a size needs:
    #stacked  COMP over HQ. Readable from 48 pixels up.
    #hq-only  HQ alone, larger. At 16 and 32 pixels COMP is a smudge, so those
              sizes drop it (SPEC B11.2).
  The field is a rounded square; the renderer squares it off for the maskable
  icon, which the system crops itself, and every letter sits inside the central
  circle of radius 205 (the maskable safe zone).
-->
<rect id="field" width="512" height="512" rx="104" fill="#141b2d"/>
<g id="stacked" font-family="Big Shoulders Display" text-anchor="middle">
<text x="266" y="165" font-weight="800" font-size="67" letter-spacing="20" fill="#ffffff">COMP</text>
<text x="257" y="389" font-weight="900" font-size="256" letter-spacing="-3" fill="#ff6b1a">HQ</text>
</g>
<g id="hq-only" font-family="Big Shoulders Display" text-anchor="middle" display="none">
<text x="258" y="428" font-weight="900" font-size="430" letter-spacing="-4" fill="#ff6b1a">HQ</text>
</g>
</svg>
