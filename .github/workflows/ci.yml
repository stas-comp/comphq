name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      full:
        description: "Run every layer: container, speed and screens"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags integration ./...
      - name: docx fixtures are reproducible (P1-11)
        run: |
          go run ./e2e/fixtures/docx/gen
          git diff --exit-code -- e2e/fixtures/docx
      - run: go test ./tools/policy/...

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-browser-${{ hashFiles('go.sum', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-browser-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: editor bundle is reproducible (P1-09)
        run: |
          npm run vendor:editor
          git diff --exit-code -- web/static/vendor
      - run: npm run test:e2e
      - run: npm run test:a11y

  # Layer 4. Runs on every push for now (the plan's full path-based
  # triggering is added in P1-06, once Dockerfile and deploy/ exist to
  # trigger on) — until then, use the [container] commit flag or a full
  # dispatch/tag run. See docs/decisions.md D-03.
  container:
    needs: [go, browser]
    if: >-
      contains(github.event.head_commit.message, '[container]') ||
      (github.event_name == 'workflow_dispatch' && inputs.full) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags: the upgrade/rollback sub-test needs release tags
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash deploy/test/container-test.sh

  speed:
    needs: [go, browser]
    if: >-
      contains(github.event.head_commit.message, '[speed]') ||
      (github.event_name == 'workflow_dispatch' && inputs.full) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:speed

  screens:
    needs: [go, browser]
    if: (github.event_name == 'workflow_dispatch' && inputs.full) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:screens
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens
          path: reports/screens
