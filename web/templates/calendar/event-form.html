{{define "calendar-event-form"}}
{{if .Message}}<p class="message" role="alert">{{.Message}}</p>{{end}}
<form method="post" action="{{.FormAction}}" class="calendar-event-form">
<label for="event-title">Title</label>
<input class="field" type="text" id="event-title" name="title" value="{{.Title}}" required>

<label for="event-start-date">Date</label>
<input class="field field-date" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy or dd/mm" id="event-start-date" name="start_date" value="{{.StartDate}}" required>

<label for="event-end-date">End date (optional, for an event lasting several days)</label>
<input class="field field-date" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy or dd/mm" id="event-end-date" name="end_date" value="{{.EndDate}}" data-date-after="event-start-date">

<label for="event-start-time">Start time (leave blank for an all-day event)</label>
<input class="field" type="time" id="event-start-time" name="start_time" value="{{.StartTime}}">

<label for="event-end-time">End time (optional)</label>
<input class="field" type="time" id="event-end-time" name="end_time" value="{{.EndTime}}">

<label for="event-notes">Notes</label>
<textarea class="field" id="event-notes" name="notes">{{.Notes}}</textarea>

<label for="event-recurrence">Repeats</label>
<select class="field" id="event-recurrence" name="recurrence">
{{$recurrence := .Recurrence}}
{{range .Recurrences}}<option value="{{.Value}}"{{if eq .Value $recurrence}} selected{{end}}>{{.Label}}</option>{{end}}
</select>

<label for="event-until-date">Until (optional, for a repeating event)</label>
<input class="field field-date" type="text" inputmode="numeric" autocomplete="off" placeholder="dd/mm/yyyy or dd/mm" id="event-until-date" name="until_date" value="{{.UntilDate}}" data-date-after="event-start-date">

<fieldset class="calendar-notice-field">
<legend>Show in briefing ahead</legend>
<label class="visually-hidden" for="event-notice-amount">Number (0 for not early)</label>
<input class="field" type="number" id="event-notice-amount" name="notice_amount" min="0" value="{{.NoticeAmount}}">
<label class="visually-hidden" for="event-notice-unit">Unit</label>
<select class="field" id="event-notice-unit" name="notice_unit">
<option value="days"{{if eq .NoticeUnit "days"}} selected{{end}}>days</option>
<option value="weeks"{{if eq .NoticeUnit "weeks"}} selected{{end}}>weeks</option>
</select>
</fieldset>

<button class="btn primary" type="submit">Save</button>
</form>
{{end}}
