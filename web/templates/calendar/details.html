{{define "calendar-details.html"}}
<p><a href="/calendar">Back to Calendar</a></p>
<h1>{{.Title}}</h1>
<p class="calendar-last-changed">Last changed by {{.UpdatedByName}} · {{.UpdatedAt}}</p>
{{template "calendar-event-form" .}}

<form method="post" action="/calendar/events/{{.EventID}}/remove" class="calendar-remove-form">
<button class="btn" type="submit">Remove event</button>
</form>
{{end}}
