{{define "layout.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — Comp HQ</title>
<link rel="stylesheet" href="/static/theme/theme.css">
<link rel="stylesheet" href="/static/app/frame.css">
<link rel="stylesheet" href="/static/settings/settings.css">
<link rel="stylesheet" href="/static/kb/kb.css">
<link rel="stylesheet" href="/static/kb/editor.css">
<link rel="stylesheet" href="/static/tasks/board.css">
<link rel="stylesheet" href="/static/tasks/team.css">
<link rel="stylesheet" href="/static/tasks/myjobs.css">
<link rel="stylesheet" href="/static/calendar/calendar.css">
<link rel="stylesheet" href="/static/briefing/briefing.css">
<link rel="manifest" href="/static/app/manifest.webmanifest">
</head>
<body data-ready>
<div class="frame">
<aside class="sidebar">
<div class="wordmark"><small>Comp</small>
<strong>HQ</strong></div>
<nav aria-label="Sections">
<ul>
{{range .Nav}}
<li><a href="{{.Path}}"{{if .Current}} aria-current="page" class="current"{{end}}>
<span class="icon icon-{{.Icon}}" aria-hidden="true"></span>
<span>{{.Label}}</span>
</a></li>
{{end}}
</ul>
</nav>
<p class="ver">Version {{.Version}}</p>
</aside>
<div class="main-column">
{{if .ShowBackupBanner}}
<div class="backup-banner" role="alert">The last backup is more than 2 days old. Check <a href="/settings/backups">Settings → Backups</a>.</div>
{{end}}
<header class="topbar">
<form class="search" role="search" action="/kb/search" method="get" autocomplete="off">
<span class="icon icon-search" aria-hidden="true"></span>
<label for="search-box" class="visually-hidden">Search articles</label>
<input class="search-input" type="search" id="search-box" name="q" placeholder="Search articles">
<kbd aria-hidden="true">/</kbd>
</form>
<div class="you">
<span>You: <strong>{{.PersonName}}</strong></span>
<span class="av me" aria-hidden="true">{{.PersonInitials}}</span>
<a href="{{.ChangeHref}}">Change</a>
</div>
</header>
<main>
<button class="btn primary" id="refresh-notice" type="button" hidden>Updated — refresh</button>
{{.BodyContent}}
</main>
</div>
</div>
<script src="/static/kb/messages.js"></script>
<script src="/static/kb/search.js"></script>
<script src="/static/app/refresh.js"></script>
</body>
</html>
{{end}}
