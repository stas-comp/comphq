{{define "kb-editor.html"}}
<h1>{{if .ID}}Edit article{{else}}New article{{end}}</h1>
{{if .Message}}<p class="message" role="alert">{{.Message}}</p>{{end}}

{{if .Categories}}
<form method="post" action="/kb/articles" id="article-form" class="article-form">
<input type="hidden" name="id" value="{{.ID}}">
<input type="hidden" name="version_no" value="{{.VersionNo}}">
<label for="article-category">Category</label>
<select class="field" id="article-category" name="category_id" required>
{{$selected := .CategoryID}}
{{range .Categories}}
<option value="{{.ID}}" {{if eq .ID $selected}}selected{{end}}>{{.Name}}</option>
{{end}}
</select>

<label for="article-title">Title</label>
<input class="field title-in" type="text" id="article-title" name="title" value="{{.Title}}" required>

<div class="editor-toolbar" role="toolbar" aria-label="Formatting">
<button class="tb" type="button" id="btn-h2">Large heading</button>
<button class="tb" type="button" id="btn-h3">Small heading</button>
<span class="sep" aria-hidden="true"></span>
<button class="tb" type="button" id="btn-bold">Bold</button>
<button class="tb" type="button" id="btn-italic">Italic</button>
<span class="sep" aria-hidden="true"></span>
<button class="tb" type="button" id="btn-bullet">Bullets</button>
<button class="tb" type="button" id="btn-ordered">Numbers</button>
<button class="tb" type="button" id="btn-link">Link</button>
<button class="tb" type="button" id="btn-table">Table</button>
<button class="tb" type="button" id="btn-add-row">Add row</button>
<button class="tb" type="button" id="btn-remove-row">Remove row</button>
<button class="tb" type="button" id="btn-add-col">Add column</button>
<button class="tb" type="button" id="btn-remove-col">Remove column</button>
<button class="tb" type="button" id="btn-image">Image</button>
<button class="btn primary word" type="button" id="btn-import-word"><span class="icon icon-import-word" aria-hidden="true"></span>Import from Word</button>
</div>
<div id="editor-message" class="message" role="alert" hidden></div>
<label class="visually-hidden" for="article-editor">Content</label>
<div id="article-editor" class="article-editor"></div>
<input type="file" id="image-file-input" accept="image/png,image/jpeg,image/gif,image/webp" class="visually-hidden" aria-label="Choose a picture">
<input type="file" id="docx-file-input" accept=".docx" class="visually-hidden" aria-label="Choose a Word document">
<input type="hidden" name="body_html" id="article-body-html">

<div class="editor-actions">
{{if .Conflict}}
<input type="hidden" name="override" value="1">
<button class="btn primary" type="submit" id="btn-publish">Publish mine anyway</button>
{{else}}
<button class="btn primary" type="submit" id="btn-publish">Publish</button>
{{end}}
<button class="btn" type="button" id="btn-cancel">Cancel</button>
</div>
</form>
<script type="application/json" id="article-initial-body-html">{{.BodyHTMLJS}}</script>
<script src="/static/vendor/editor/editor-3.31.3.js"></script>
<script src="/static/kb/editor.js"></script>
{{else}}
<p>Create a category before adding an article. <a href="/kb/categories">Add one</a>.</p>
{{end}}
{{end}}
