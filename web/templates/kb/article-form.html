{{define "kb-article-form.html"}}
<h1>{{if .ID}}Edit article{{else}}New article{{end}}</h1>
{{if .Message}}<p class="message" role="alert">{{.Message}}</p>{{end}}

{{if .Categories}}
<form method="post" action="/kb/articles" class="article-form">
<input type="hidden" name="id" value="{{.ID}}">
<label for="article-category">Category</label>
<select id="article-category" name="category_id" required>
{{$selected := .CategoryID}}
{{range .Categories}}
<option value="{{.ID}}" {{if eq .ID $selected}}selected{{end}}>{{.Name}}</option>
{{end}}
</select>

<label for="article-title">Title</label>
<input type="text" id="article-title" name="title" value="{{.Title}}" required>

<label for="article-body">Content</label>
<textarea id="article-body" name="body_html" rows="12">{{.BodyHTML}}</textarea>

<button type="submit">Publish</button>
</form>
{{else}}
<p>Create a category before adding an article. <a href="/kb/categories">Add one</a>.</p>
{{end}}
{{end}}
